<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Shopping Cart | Sara's Shirt Shop</title>
    <link rel="stylesheet" href="SSS.css">
</head>

<body>

    <header>
        <h1>Sara's Shirt Shop</h1>
    </header>

    <main>

        <div class="cart-layout">

            <section class="cart">
                <h2>Shopping Cart</h2>

                <button type="button"
                        class="return-button"
                        onclick="window.location.href='index.html'">
                    Return to Store
                </button>

                <div id="cart-items">
                </div>
            </section>

            <aside class="order-summary">
                <h2>Order Summary</h2>

                <p>
                    Items (<span id="summary-count">0</span>):
                    <span id="items-total">$0.00</span>
                </p>

                <p>
                    Tax:
                    <span id="tax-total">$0.00</span>
                </p>

                <p>
                    Shipping &amp; Handling:
                    <span id="shipping-total">$0.00</span>
                </p>

                <hr>

                <p class="summary-grand-total">
                    Grand Total:
                    <span id="summary-grand-total">$0.00</span>
                </p>

                <button type="button"
                        class="checkout-button"
                        onclick="window.location.href='Billing.html'">
                    Complete Purchase
                </button>
            </aside>

        </div>
    </main>

</body>

<script>
    let itemsTotal = 0;
    let itemCount = 0;

    const taxRate = 0.06;

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const cartItems = document.getElementById("cart-items");

    cart.forEach(function(item, index) {
        
        itemsTotal = itemsTotal + (item.price * item.amount);
        itemCount = itemCount + item.amount;

        const itemDiv = document.createElement("div");
        itemDiv.className = "cart-item";

        itemDiv.innerHTML = `
            <img src="images/${item.game}-${item.color}.png"
                 alt="${item.color} ${item.game} T-shirt">

            <div class="cart-item-info">
                <h3>${item.game}</h3>

                <p>Color: ${item.color}</p>
                <p>Size: ${item.size}</p>
                <div class="cart-quantity">
                    <span>Quantity:</span>

                    <button type="button" onclick="changeCartAmount(${index}, -1)">−</button>

                    <span>${item.amount}</span>

                    <button type="button" onclick="changeCartAmount(${index}, 1)">+</button>
                </div>

                <button type="button"
                        class="remove-button"
                        onclick="removeFromCart(${index})">
                    Remove from Cart
                </button>
                <p>Price: $${item.price.toFixed(2)} each</p>
                <p>Subtotal: $${(item.price * item.amount).toFixed(2)}</p>

            </div>
        `;

        cartItems.appendChild(itemDiv);
        });

    const shipping = itemsTotal > 0 ? 5.00 : 0;
    const tax = itemsTotal * taxRate;
    const grandTotal = itemsTotal + tax + shipping;

    function changeCartAmount(index, change) {
    cart[index].amount = cart[index].amount + change;

    if (cart[index].amount < 1) {
        cart[index].amount = 1;
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    location.reload();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);

        localStorage.setItem("cart", JSON.stringify(cart));

        location.reload();
    }

    document.getElementById("summary-count").textContent = itemCount;

    document.getElementById("items-total").textContent =
        "$" + itemsTotal.toFixed(2);

    document.getElementById("tax-total").textContent =
        "$" + tax.toFixed(2);

    document.getElementById("shipping-total").textContent =
        "$" + shipping.toFixed(2);

    document.getElementById("summary-grand-total").textContent =
        "$" + grandTotal.toFixed(2);
</script>

</html>
